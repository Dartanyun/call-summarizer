[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "call-summarizer"
dynamic = ["version"]
description = "Запись созвонов, локальное распознавание речи и говорящих, саммари через Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "faster-whisper>=1.1",
    "anthropic>=1.15",
    "sherpa-onnx>=1.12",
    "numpy",
    # только Windows: запись через WASAPI и ffmpeg внутри пакета
    "soundcard>=0.4.4; sys_platform == 'win32'",
    "imageio-ffmpeg>=0.5; sys_platform == 'win32'",
]

[project.gui-scripts]
call-summarizer = "callsum.__main__:main"

[tool.setuptools]
packages = ["callsum"]

[tool.setuptools.dynamic]
version = { attr = "callsum.__version__" }

[tool.setuptools.package-data]
callsum = ["*.svg", "icons/*.svg", "icons/tray/*.svg"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# только настоящие ошибки: неопределённые имена, синтаксис, типичные ловушки
select = ["F", "E9", "B"]
