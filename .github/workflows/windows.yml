# Проверка версии для Windows на чистой Windows: установка, работа модулей, удаление.
# Запускается вручную (Actions → Windows → Run workflow), чтобы не тратить минуты на каждый коммит.
name: Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Установка (install.cmd без участия пользователя)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1

      - name: Ярлык в меню «Пуск»
        shell: pwsh
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Саммари созвонов.lnk"
          if (-not (Test-Path -LiteralPath $lnk)) { throw "Ярлык не создан: $lnk" }
          # WScript.Shell не читает пути с кириллицей на английской Windows — читаем через копию
          $copy = Join-Path $env:TEMP "check.lnk"
          Copy-Item -LiteralPath $lnk $copy -Force
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($copy)
          $s | Format-List TargetPath, Arguments, IconLocation
          if (-not (Test-Path $s.TargetPath)) { throw "Ярлык указывает на несуществующий файл: $($s.TargetPath)" }

      - name: Проверка модулей
        shell: pwsh
        env:
          # настоящий оконный режим Windows: нужен для горячей клавиши и трея
          PYTHONIOENCODING: utf-8
        run: '& "$env:LOCALAPPDATA\CallSummarizer\venv\Scripts\python.exe" tests\windows_smoke.py'

      - name: Удаление
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File uninstall.ps1
