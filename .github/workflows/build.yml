# Готовые сборки: Linux (.tar.gz и .deb) и Windows (установщик и .zip без установки).
# Каждая сборка проверяется по-настоящему: ставится, запускает самопроверку с пробным
# распознаванием и удаляется. Запускается из release.yml для каждой новой версии и вручную
# (Actions → Build → Run workflow) — тогда файлы лежат в артефактах запуска.
name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35): сборка запустится на Debian 12+, Ubuntu 22.04+ и других
    # дистрибутивах не старше этих
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Системные пакеты (нужны для самопроверки)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg pulseaudio-utils libxcb-cursor0 libegl1

      - name: Библиотеки и PyInstaller
        run: python -m pip install --quiet . pyinstaller

      - name: Сборка
        run: python packaging/build.py

      - name: Пакет .deb — установка, самопроверка, удаление
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y -q ./dist/call-summarizer_*_amd64.deb
          call-summarizer --version
          call-summarizer --self-check --full
          sudo apt-get remove -y -q call-summarizer
          test ! -e /opt/call-summarizer

      - name: Архив .tar.gz — install.sh в домашнюю папку, запуск, удаление
        run: |
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -xzf dist/call-summarizer-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/unpack"
          cd "$RUNNER_TEMP"/unpack/call-summarizer-*/
          ./install.sh
          ~/.local/bin/call-summarizer --version
          test -f ~/.local/share/applications/call-summarizer.desktop
          ./uninstall.sh --purge
          test ! -e ~/.local/bin/call-summarizer

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          compression-level: 0
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Библиотеки и PyInstaller
        run: python -m pip install --quiet . pyinstaller

      - name: Сборка
        env:
          PYTHONIOENCODING: utf-8
        run: python packaging/build.py

      - name: Установщик — установка без прав администратора, самопроверка, удаление
        shell: pwsh
        run: |
          $setup = (Get-Item dist\CallSummarizer-*-setup.exe).FullName
          # Start-Process -Wait в PowerShell 7 ждёт и дочерние процессы, а установщик запускает
          # программу — поэтому ждём только сам установщик
          function Run-Setup([string[]]$arguments) {
            $p = Start-Process $setup -ArgumentList $arguments -PassThru
            $p.WaitForExit()
            return $p.ExitCode
          }
          $code = Run-Setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER")
          if ($code) { throw "Установщик завершился с кодом $code" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\CallSummarizer"
          $app = Join-Path $dir "CallSummarizer.exe"
          # после тихой установки (так ставятся обновления из программы) программа запускается сама
          function Wait-App { for ($i = 0; $i -lt 30; $i++) { if (Get-Process CallSummarizer -ErrorAction SilentlyContinue) { return $true }; Start-Sleep 1 }; return $false }
          if (-not (Wait-App)) { throw "После тихой установки программа не запустилась" }
          Stop-Process -Name CallSummarizer -Force; Start-Sleep 2
          if (-not (Test-Path $app)) { throw "Программа не установлена в $dir" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Саммари созвонов.lnk"
          if (-not (Test-Path -LiteralPath $lnk)) { throw "Нет ярлыка в меню «Пуск»" }
          (Get-Item $app).VersionInfo | Format-List ProductName, ProductVersion, FileDescription
          Get-ChildItem "$dir\_internal" -Filter "*140*.dll" | Select-Object -ExpandProperty Name

          $report = Join-Path $env:RUNNER_TEMP "self-check.txt"
          $p = Start-Process $app -ArgumentList "--self-check", "--full", "--report", $report -Wait -PassThru
          Get-Content $report -Encoding utf8
          if ($p.ExitCode) { throw "Самопроверка не прошла" }

          # обновление поверх работающей программы — так, как его запускает сама программа:
          # установщик закрывает её, ставит новую версию и запускает снова
          Start-Process $app
          if (-not (Wait-App)) { throw "Программа не запустилась" }
          $code = Run-Setup @("/SILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if ($code) { throw "Обновление поверх завершилось с кодом $code" }
          if (-not (Wait-App)) { throw "После обновления программа не запустилась снова" }
          Stop-Process -Name CallSummarizer -Force; Start-Sleep 2

          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # деинсталлятор перезапускает себя из временной папки — ждём, пока он закончит
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { throw "Программа не удалилась" }
          if (Test-Path -LiteralPath $lnk) { throw "Ярлык не удалился" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          compression-level: 0
          if-no-files-found: error
